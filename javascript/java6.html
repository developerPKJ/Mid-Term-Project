자바스크립트는 컴파일 해도 수행 파일이 생성되지 않음
JIT(Just In Time) : 자바스크립트 엔진은 코드가 실행되기 전에 컴파일 실행, 이때 코드의 일부를 미리 최적화된 바이틐코드나 기계어로 변환하여 성능 향상
실행 중 최적화 : 코드 실행 중에도 빈번하게 사용되는 코드 경로를 분석하고 최적화

단점 : var로 변수선언과 let이나 const로 변수선언 할 때 서로 동작 방식이 다름, 호이스팅 사용해도 메모리 에러가 뜸(초기화 안되거나 레퍼런스 오류)
