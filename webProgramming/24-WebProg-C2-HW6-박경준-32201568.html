<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>별 문자 출력하기</title>
        <script>
            function printStar(num) {
                i = parseInt(num);
        
                if (Number.isInteger(i) && i > 0) {
                    for (n = 0; n < i; n++) {
                        for (j = 0; j <= n; j++) {
                            document.write("*");
                        }
                        document.write("<br>")
                    }
                }
                else {
                    document.write("입력 오류 입니다.")
                }
            }
        </script>
    </head>

    <body>
        <h2>별 문자 출력하기</h2>
        <hr>
        <script>
            var num = prompt("정수를 입력하세요", 1);
            printStar(num);
        </script>
    </body>
</html>
